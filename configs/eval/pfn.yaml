method: pfn

data:
  wanted_domains: [cancer, hiv, warfarin, mimic]
  raw_inputs:
    pickle_dirs:
      - outputs/benchmarks/cancer
      - outputs/benchmarks/hiv
      - outputs/benchmarks/warfarin
      - outputs/benchmarks/mimic
  ready_inputs:
    ready_dirs:
      - outputs/pfn_ready

ready_builder:
  pfn_max_context: 500
  output_dir: outputs/pfn_ready
  ready_build_id: causal_long_pfn_ready_seed_2026
  overwrite: false
  seed: 2026

evaluation:
  output_dir: outputs/paper_evaluations/causal_long_pfn/seed_42
  batch_size: 32
  report_calibration: true
