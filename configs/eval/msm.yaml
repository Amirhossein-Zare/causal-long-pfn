method: msm
data:
  wanted_domains:
  - cancer
  - hiv
  - warfarin
  - mimic
  raw_inputs:
    pickle_dirs:
    - outputs/benchmarks/cancer
    - outputs/benchmarks/hiv
    - outputs/benchmarks/warfarin
    - outputs/benchmarks/mimic
evaluation:
  output_dir: outputs/eval/msm
  query_seed: 4242
tuning:
  initial_random_search: 1
  state_dir: outputs/tuning_state/msm
  plan_seed: 1701
  split_seed: 2701
  train_seed: 3701
  validation_seed: 4701
fitting:
  fit_root: outputs/fits
  final_fit_seed: 101
baseline:
  limits:
    max_val_origins: 512
  default_hparams:
    lag_features: 1
    weight_clip_quantiles:
    - 0.01
    - 0.99
    regressor: linear
    ridge_alpha: 1.0
    max_logistic_iter: 500
    min_train_per_tau: 5
  search_space:
    lag_features:
    - 1
    regressor:
    - linear
execution:
  mode: tune
